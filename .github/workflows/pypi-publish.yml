name: Publish to PyPI

# Publishes on every version tag (v*), so `pip install herandhim` and
# `pipx install herandhim` work without cloning.
#
# (`claw-soul`/`herandhim` are blocked on PyPI — an unrelated "HerAndHims"
# project owns the ultra-normalized name, and PyPI treats all punctuation
# variants as the same name.)
#
# Auth: a PyPI API token in the PYPI_API_TOKEN repo secret. Set it with:
#   gh secret set PYPI_API_TOKEN
# (Trusted Publishing/OIDC also works — add a publisher on pypi.org for
# owner=ericwang915, repo=HerAndHim, workflow=pypi-publish.yml, then drop
# the password line below.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Verify the wheel installs and the CLI runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/herandhim --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
