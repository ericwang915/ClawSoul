# Fly.io config — run your own ClawSoul in the cloud instead of on a machine
# at home. One instance, one companion, your keys.
#
# App name is global on fly.dev — change if "clawsoul" is taken.

app             = "clawsoul"
primary_region  = "sin"        # pick the region closest to you
swap_size_mb    = 512

[build]
  dockerfile = "Dockerfile"

[env]
  PORT          = "7788"
  CLAWSOUL_HOME = "/data"

[http_service]
  internal_port        = 7788
  force_https          = true
  auto_stop_machines   = "off"   # Telegram polling needs always-on; revisit when we switch to webhooks
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "30s"
    method       = "GET"
    path         = "/api/status"

# One companion needs far less than this; 1 GB leaves headroom for the
# embedding model and photo generation. shared-cpu-1x / 512mb also works.
[[vm]]
  size   = "shared-cpu-2x"
  memory = "1gb"

# Persistent volume for ~/.claw_soul/ contents (config, memory, photos, logs).
# Volume is created once via `fly volumes create` (see README) and
# auto-attaches to the machine on every deploy.
[[mounts]]
  source       = "claw_data"
  destination  = "/data"
  initial_size = "1gb"
