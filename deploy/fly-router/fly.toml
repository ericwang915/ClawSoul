# Fly.io config for the ClawSoul Router/Scheduler service.
#
# Always-on, single instance.  Receives Telegram webhooks at
# /telegram/<bot-token> and runs the central APScheduler for paid users'
# cron jobs.  Wakes per-user worker machines (in the `clawsoul-worker`
# app) via the Fly Machines API when an event lands.
#
# This is intentionally separate from the legacy `clawsoul` app so the
# existing single-process production keeps serving while Phase 2 lands.

app             = "clawsoul-router"
primary_region  = "sin"

[build]
  # Re-use the existing image — entrypoint.sh dispatches to router mode
  # when CLAW_ROLE=router is set.
  dockerfile = "Dockerfile"

[env]
  PORT       = "7788"
  CLAW_ROLE  = "router"

[http_service]
  internal_port        = 7788
  force_https          = true
  # Router holds the central clock, must stay up.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "30s"
    method       = "GET"
    path         = "/health"

# Router is light — 256 MB is comfortable; bump if Postgres job store goes in later.
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
