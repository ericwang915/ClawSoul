services:
  herandhim:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "7788:7788"
    env_file:
      - .env
    volumes:
      # Persistent data: memory, chat history, config, photos.
      - herandhim_data:/data
    restart: unless-stopped

volumes:
  herandhim_data:
