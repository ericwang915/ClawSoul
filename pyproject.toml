[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claw_soul"
version = "0.1.0"
description = "ClawSoul — your virtual AI partner (boyfriend or girlfriend) on Telegram, powered by LLM with memory, RAG, and skills."
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "Eric Wang", email = "wangchen2007915@gmail.com"},
]
keywords = ["llm", "agent", "ai", "telegram", "chatbot", "ai-companion", "virtual-girlfriend", "virtual-boyfriend", "memory", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai",
    "anthropic",
    "google-genai>=1.0",
    "python-telegram-bot[job-queue]>=20.0",

    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.24",
    "pyjwt[crypto]>=2.8",
    "tavily-python",
    "rank-bm25>=0.2",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "beautifulsoup4",
    "requests",
]

# Optional feature sets — a single-user self-host needs none of these.
#   pip install -e ".[cloud]"    # Tigris/S3 photo storage (multi-machine SaaS)
#   pip install -e ".[twitter]"  # the Twitter/X skill
#   pip install -e ".[all]"      # everything
[project.optional-dependencies]
cloud = ["boto3>=1.34"]
twitter = ["tweepy>=4.14"]
all = ["boto3>=1.34", "tweepy>=4.14"]

[project.scripts]
claw_soul = "claw_soul.main:main"

[project.urls]
Homepage = "https://github.com/ericwang915/ClawSoul"
Documentation = "https://github.com/ericwang915/ClawSoul#readme"
Repository = "https://github.com/ericwang915/ClawSoul"
Issues = "https://github.com/ericwang915/ClawSoul/issues"

[tool.setuptools.packages.find]
include = ["claw_soul*"]

[tool.setuptools.package-data]
claw_soul = [
    "templates/**/*.py",
    "templates/**/*.sh",
    "templates/**/*.yaml",
    "templates/**/*.md",
    "web/static/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", "*.pyo"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
